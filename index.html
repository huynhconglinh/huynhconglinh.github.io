<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NihongoShiken.Lite</title>
  <meta name="description" content="Luyện JLPT: Tổng ôn N3. Chọn đáp án biết đúng/sai ngay.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Ctext x='32' y='42' text-anchor='middle' fill='white' font-size='20' font-family='Segoe UI,sans-serif' font-weight='700'%3EN3%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="site-header">
      <div class="brand" id="brand" title="Về danh sách đề">
        <h1>Nihongo<span>Shiken</span></h1>
      </div>
      <div class="header-meta" id="header-meta">Đang tải…</div>
      <nav class="top-nav" id="top-nav" aria-label="Điều hướng đề thi">
        <div class="top-nav-links" id="top-nav-links"></div>
        <div class="header-tools">
          <div class="nav-group nav-group-tools" id="progress-menu-group">
            <button type="button" class="nav-trigger">Tiến độ</button>
            <div class="nav-list nav-list-tools">
              <button type="button" class="nav-link nav-link-tool" id="btn-import-progress">
                <span class="nav-link-title">Import</span>
              </button>
              <button type="button" class="nav-link nav-link-tool" id="btn-export-progress">
                <span class="nav-link-title">Export</span>
              </button>
            </div>
          </div>
          <input type="file" id="progress-import-file" accept="application/json,.json" hidden>
        </div>
      </nav>
    </header>

    <section id="dashboard-view" class="view active">
      <div id="dashboard-root">
        <div class="status-banner">Đang tải danh sách đề…</div>
      </div>
    </section>

    <section id="quiz-view" class="view">
      <div class="quiz-top">
        <div class="quiz-top-row">
          <button type="button" class="btn btn-ghost" id="btn-back">← Danh sách</button>
          <div class="quiz-title-wrap">
            <button type="button" class="exam-code quiz-code" id="quiz-code" title="Nhấn để copy mã đề">—</button>
            <span class="quiz-title" id="quiz-title">Đề</span>
          </div>
        </div>
      </div>
      <div class="quiz-layout">
        <aside class="quiz-side">
          <div class="quiz-side-bar">
            <div class="quiz-stats">
              <span>Đã làm: <strong id="stat-answered">0/0</strong></span>
              <span>Đúng: <strong class="ok-num" id="stat-correct">0</strong></span>
            </div>
            <button type="button" class="btn btn-danger btn-reset-exam" id="btn-reset">Làm lại đề</button>
          </div>
          <div class="toc" id="toc" aria-label="Mục lục câu hỏi"></div>
        </aside>
        <div class="quiz-main" id="quiz-body"></div>
      </div>
    </section>
  </div>

  <script src="js/labels.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
